<!DOCTYPE html>
<html lang="en">

    <meta name="keywords" content="Riad, Blog, Programming, Technology, Tutorials, Web Development">
    <meta name="author" content="Riad">
    <title>Blog | Riad - CSE Student</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💻</text></svg>">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <span class="logo-text">Riad<span class="logo-dot">.</span></span>
                </a>
            </div>
            <div class="nav-menu" id="navMenu">
                <a href="index.html#home" class="nav-link">Home</a>
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#skills" class="nav-link">Skills</a>
                <a href="index.html#projects" class="nav-link">Projects</a>
                <a href="blogs.html" class="nav-link active">Blog</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </div>
            <div class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Blog Hero Section -->
    <section class="blog-hero">
        <div class="container">
            <div class="blog-hero-content">
                <h1 class="blog-hero-title">
                    <span class="gradient-text">My Blog</span>
                </h1>
                <p class="blog-hero-description">Sharing my journey, tutorials, and insights on programming, productivity, and technology</p>
            </div>
        </div>
    </section>

    <!-- Blog Section -->
    <section class="blog-main">
        <div class="container">
            <div class="blog-filters">
                <button class="filter-btn active" data-category="all">All Posts</button>
                <button class="filter-btn" data-category="Career">Career</button>
                <button class="filter-btn" data-category="Tutorial">Tutorial</button>
                <button class="filter-btn" data-category="Productivity">Productivity</button>
            </div>
            <div class="blog-grid" id="blogGrid">
                <!-- Blog posts will be loaded here dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2026 Riad. Built with passion and dedication.</p>
                <p class="footer-subtitle">Made with ❤️ in Bangladesh</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
